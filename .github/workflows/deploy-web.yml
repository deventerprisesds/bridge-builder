name: Deploy Bridge Builder Web

on:
  push:
    paths: ['web/**']
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Static Web App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web
        working-directory: web
        run: npm ci && npm run build
        env:
          VITE_API_BASE_URL: https://bridge-builder-api.azurewebsites.net/api
          VITE_ENTRA_TENANT_NAME: enterpriseds
          VITE_ENTRA_TENANT_ID: b9791c7d-dd6c-4190-b1bb-dbbd1996bc2e
          VITE_ENTRA_CLIENT_ID: 59465948-6e95-4124-984e-a43acade2fa9
          VITE_ENTRA_SCOPES: "openid profile email"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
